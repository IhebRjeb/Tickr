# Tickr - Docker Compose Development Override
# Services spécifiques au développement (backend + frontend)
#
# USAGE:
#   Option 1 (Full Docker): make dev
#   Option 2 (Hybrid - Recommended): make docker-up && cd backend && npm run start:dev
#
# Le mode hybride est recommandé car il évite les problèmes de sync node_modules

services:
  # Backend NestJS - Mode Développement avec Hot Reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: development
    container_name: tickr-backend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229"  # Node.js Debug Port
    environment:
      NODE_ENV: development
      PORT: 3000
      
      # Database (must match DB_* naming expected by app)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: tickr
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tickr
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: tickr123
      REDIS_URL: redis://:tickr123@redis:6379
      REDIS_TTL: 300
      
      # JWT
      JWT_SECRET: dev-super-secret-key-change-in-production
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      
      # AWS Local (LocalStack)
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT: http://localstack:4566
      S3_BUCKET: tickr-dev
      S3_ENDPOINT: http://localstack:4566
      
      # SES / SNS (LocalStack)
      SES_FROM_EMAIL: noreply@tickr.local
      SES_REGION: eu-west-1
      SES_CONFIGURATION_SET: tickr-notifications
      SNS_REGION: eu-west-1
      SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:tickr-notifications
      
      # Notification Rate Limits
      NOTIFICATION_RATE_LIMIT_USER: 20
      NOTIFICATION_RATE_LIMIT_EMAIL_SEC: 50
      NOTIFICATION_RATE_LIMIT_SMS_MIN: 100
      NOTIFICATION_MAX_RETRIES: 3
      
      # Email (Maildev)
      SMTP_HOST: maildev
      SMTP_PORT: 1025
      SMTP_USER: tickr
      SMTP_PASS: tickr123
      SMTP_FROM: noreply@tickr.local
      
      # Frontend URL
      FRONTEND_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001
      
      # Stripe (test keys for development)
      STRIPE_SECRET_KEY: sk_test_placeholder_replace_with_real_key
      STRIPE_PUBLIC_KEY: pk_test_placeholder_replace_with_real_key
      STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
      
      # Flouci (local payments - TND)
      FLOUCI_APP_TOKEN: placeholder_flouci_token
      FLOUCI_APP_SECRET: placeholder_flouci_secret
      
      # Debug
      DEBUG: tickr:*
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      maildev:
        condition: service_started
      localstack:
        condition: service_started
    command: npm run start:dev
    networks:
      - tickr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Next.js - Mode Développement avec HMR
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: tickr-frontend-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: http://backend:3000
      NEXT_PUBLIC_APP_NAME: Tickr
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_ENABLE_DEVTOOLS: "true"
      NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    networks:
      - tickr-network
    stdin_open: true
    tty: true

# Named volumes for node_modules persistence (rebuilt on docker-compose build)
volumes:
  backend_node_modules:
    driver: local
  backend_cache:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_next:
    driver: local
